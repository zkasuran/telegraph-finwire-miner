version: "1"
kind: miner
id: 7320
slug: finwire-crypto-price
protocol: generic
name: FinWire Crypto Price
description: >
  Spot price of a crypto asset in US dollars, read live at request time and returned as one
  natural sentence with the price, the market cap and the 24 hour change. CoinGecko is the
  primary source, with Coinbase and Binance raced as fallbacks so a slow endpoint never eats
  a spot check's deadline. Answers the CRYPTO_PRICE intent. Give it a ticker such as BTC or a
  CoinGecko id such as bitcoin. No API key, nothing cached that can go stale.
base_url: https://telegraph-fin.margyn.workers.dev

docs:
  documentation: https://telegraph-fin.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: symbol is a ticker such as BTC, ETH, SOL or a CoinGecko id such as bitcoin. A whole question is accepted too. Defaults to BTC when unfilled.
    param: symbol
    property: length
    value_num: 60
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim, for example "What is the price of
        Solana?". The miner reads the asset from it, so passing the whole question works as
        well as naming the symbol.
    symbol:
      type: string
      description: Ticker such as BTC, ETH or SOL. A CoinGecko id such as bitcoin or solana works too.

output_schema:
  type: object
  properties:
    symbol:
      type: string
      description: Ticker the answer refers to.
    coingecko_id:
      type: string
      description: CoinGecko id the price was read for.
    name:
      type: string
      description: Display name of the asset.
    price_usd:
      type: number
      description: Spot price in US dollars.
    market_cap_usd:
      type: number
      description: Market capitalisation in US dollars, when the source reports it.
    change_24h_percent:
      type: number
      description: Price change over the past 24 hours, in percent.
    confidence:
      type: number
      description: 0.97 for a direct read.
    summary:
      type: string
      description: One sentence with the price and 24 hour change, then a full readings block.
    source:
      type: string
      description: Which provider answered.
    as_of:
      type: string
      description: ISO 8601 timestamp of the read.

endpoints:
  - path: /price
    external_path: /price
    method: GET
    description: >
      Spot price for one asset, symbol as a query parameter (?symbol=BTC). Also accepts a
      whole question in ?question= or ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - CRYPTO_PRICE

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: symbol
        description: Ticker the answer refers to.
        source_path: symbol
      - index: 1
        name: source
        description: Which provider answered.
        source_path: source
      - index: 2
        name: summary
        description: One sentence with the price and 24 hour change, then a full readings block.
        source_path: summary
    integers:
      - index: 0
        name: price_usd_x1000000
        description: Spot price in US dollars, scaled by one million to keep six decimals as an integer.
        source_path: price_usd
        multiplier: 1000000
      - index: 1
        name: change_24h_percent_x100
        description: 24 hour change in percent, scaled by one hundred to keep two decimals.
        source_path: change_24h_percent
        multiplier: 100
  request:
    - endpoint: price
      method: GET
      query_params:
        symbol: { source: strings.0 }
