version: "1"
kind: miner
id: 7321
slug: finwire-currency-exchange
protocol: generic
name: FinWire Currency Exchange
description: >
  Fiat exchange rate between two currencies, read live at request time from the open.er-api.com
  rates feed. Answers the CURRENCY_EXCHANGE intent: the rate, its inverse and an optional
  amount conversion, in one natural sentence. Give it a pair such as USD-EUR or a base and a
  quote. Defaults to USD to EUR when unfilled. No API key, nothing cached that can go stale.
base_url: https://telegraph-fin.margyn.workers.dev

docs:
  documentation: https://telegraph-fin.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: from and to are ISO 4217 codes such as USD, EUR, GBP, JPY. A pair like USD-EUR, a whole question or an amount is accepted too. Defaults to USD to EUR when unfilled.
    param: pair
    property: length
    value_num: 40
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim, for example "How much is 100 USD in
        EUR?". The miner reads the currencies and any amount from it, so passing the whole
        question works as well as the structured fields.
    from:
      type: string
      description: Base currency ISO 4217 code, for example USD.
    to:
      type: string
      description: Quote currency ISO 4217 code, for example EUR.
    amount:
      type: number
      description: Optional amount in the base currency to convert.

output_schema:
  type: object
  properties:
    from:
      type: string
      description: Base currency code.
    to:
      type: string
      description: Quote currency code.
    rate:
      type: number
      description: Units of the quote currency per one unit of the base.
    inverse_rate:
      type: number
      description: Units of the base currency per one unit of the quote.
    amount:
      type: number
      description: Amount converted, when one was given.
    converted:
      type: number
      description: The amount expressed in the quote currency.
    confidence:
      type: number
      description: 0.97 for a direct read.
    summary:
      type: string
      description: One sentence with the rate, then a full readings block.
    source:
      type: string
      description: The rates feed the figure came from.
    as_of:
      type: string
      description: ISO 8601 timestamp of the read.

endpoints:
  - path: /fx
    external_path: /fx
    method: GET
    description: >
      Exchange rate for one pair, as query parameters (?from=USD&to=EUR&amount=100). Also
      accepts a whole question in ?question= or ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - CURRENCY_EXCHANGE

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: from
        description: Base currency code.
        source_path: from
      - index: 1
        name: to
        description: Quote currency code.
        source_path: to
      - index: 2
        name: summary
        description: One sentence with the rate, then a full readings block.
        source_path: summary
    integers:
      - index: 0
        name: rate_x1000000
        description: Rate of quote per base, scaled by one million to keep six decimals as an integer.
        source_path: rate
        multiplier: 1000000
  request:
    - endpoint: fx
      method: GET
      query_params:
        from: { source: strings.0 }
        to: { source: strings.1 }
