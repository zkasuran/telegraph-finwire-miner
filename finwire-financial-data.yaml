version: "1"
kind: miner
id: 7324
slug: finwire-financial-data
protocol: generic
name: FinWire Financial Data
description: >
  A general financial figure, routed to the right keyless source by what the query names.
  Answers the FINANCIAL_DATA intent: a named crypto returns a CoinGecko price with market cap
  and 24 hour change, a protocol or chain returns a DeFiLlama total value locked, a stock
  returns a Stooq or Yahoo quote. Defaults to a Bitcoin market summary when nothing is named.
  One natural sentence with a full readings block behind it. No API key, nothing cached that
  can go stale.
base_url: https://telegraph-fin.margyn.workers.dev

docs:
  documentation: https://telegraph-fin.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: query names a crypto, a DeFi protocol, a chain or a stock. Add type=crypto, type=stock or type=tvl to force a route. Defaults to a Bitcoin market summary when unfilled.
    param: query
    property: length
    value_num: 120
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim, for example "What is the market cap of
        Ethereum?" or "TVL of Aave" or "Apple stock price". The miner classifies it and reads
        the figure from the matching source.
    query:
      type: string
      description: The subject of the figure, a crypto, a protocol, a chain or a stock.
    type:
      type: string
      description: Optional route override, one of crypto, stock, tvl, protocol, chain.

output_schema:
  type: object
  properties:
    resolved_intent:
      type: string
      description: The intent the query was routed to, for example CRYPTO_PRICE or TVL_LOOKUP.
    routed:
      type: string
      description: The source family that answered, crypto, tvl or stock.
    query:
      type: string
      description: The query the answer was resolved for.
    confidence:
      type: number
      description: 0.96 to 0.97 for a direct read.
    summary:
      type: string
      description: One sentence answering the figure, then a full readings block.
    source:
      type: string
      description: The provider that answered.
    as_of:
      type: string
      description: ISO 8601 timestamp of the read.

endpoints:
  - path: /financial
    external_path: /financial
    method: GET
    description: >
      A general financial figure, query as a query parameter (?query=ethereum market cap).
      Add ?type= to force a route. Also accepts a whole question in ?question=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - FINANCIAL_DATA

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: routed
        description: The source family that answered.
        source_path: routed
      - index: 1
        name: query
        description: The query the answer was resolved for.
        source_path: query
      - index: 2
        name: summary
        description: One sentence answering the figure, then a full readings block.
        source_path: summary
    integers:
      - index: 0
        name: confidence_x100
        description: Read confidence, scaled by one hundred to keep two decimals as an integer.
        source_path: confidence
        multiplier: 100
  request:
    - endpoint: financial
      method: GET
      query_params:
        query: { source: strings.1 }
