version: "1"
kind: miner
id: 7323
slug: finwire-stock-price
protocol: generic
name: FinWire Stock Price
description: >
  Latest quote for a listed stock, read live at request time. Answers the STOCK_PRICE intent
  in one natural sentence with the price and the day change. Stooq's CSV quote is the primary
  source, with the Yahoo chart endpoint as a fallback that adds the previous close, the day
  range and the company name. Give it a ticker such as AAPL. Defaults to AAPL when unfilled.
  No API key, nothing cached that can go stale.
base_url: https://telegraph-fin.margyn.workers.dev

docs:
  documentation: https://telegraph-fin.margyn.workers.dev/

limitations:
  - code: MAX_PARAM_VALUE
    message: symbol is a ticker such as AAPL, MSFT, TSLA. A whole question or a company name is accepted too. Defaults to AAPL when unfilled.
    param: symbol
    property: length
    value_num: 40
    operator: lte

rate_limit_per_sec: 2
cache_ttl_sec: 10
circuit_threshold: 5
circuit_cooldown_seconds: 30

input_schema:
  type: object
  properties:
    question:
      type: string
      description: >
        The full natural-language question, verbatim, for example "What is Tesla stock
        worth?". The miner reads the ticker from it, so passing the whole question works as
        well as naming the symbol.
    symbol:
      type: string
      description: Stock ticker, for example AAPL, MSFT, TSLA.

output_schema:
  type: object
  properties:
    symbol:
      type: string
      description: Ticker the quote is for.
    name:
      type: string
      description: Company name, when the source reports it.
    price:
      type: number
      description: Latest traded price.
    currency:
      type: string
      description: Quote currency, USD for a .us listing.
    change:
      type: number
      description: Change from the previous close, in the quote currency.
    change_percent:
      type: number
      description: Change from the previous close, in percent.
    day_high:
      type: number
      description: Session high.
    day_low:
      type: number
      description: Session low.
    previous_close:
      type: number
      description: Previous session close.
    volume:
      type: integer
      description: Session volume.
    exchange:
      type: string
      description: Listing exchange, when reported.
    confidence:
      type: number
      description: 0.96 for a direct read.
    summary:
      type: string
      description: One sentence with the price and day change, then a full readings block.
    source:
      type: string
      description: Stooq or Yahoo Finance, whichever answered.
    as_of:
      type: string
      description: ISO 8601 timestamp of the read.

endpoints:
  - path: /stock
    external_path: /stock
    method: GET
    description: >
      Latest quote for one stock, symbol as a query parameter (?symbol=AAPL). Also accepts a
      whole question in ?question= or ?query=.

semantics:
  signal_mapping:
    confidence_field: confidence
    label_field: summary
    reason_field: summary
  supported_intents:
    - STOCK_PRICE

on_chain:
  transform: direct
  min_price_usdc: 0.01
  fields:
    strings:
      - index: 0
        name: symbol
        description: Ticker the quote is for.
        source_path: symbol
      - index: 1
        name: currency
        description: Quote currency.
        source_path: currency
      - index: 2
        name: summary
        description: One sentence with the price and day change, then a full readings block.
        source_path: summary
    integers:
      - index: 0
        name: price_x1000000
        description: Latest price, scaled by one million to keep six decimals as an integer.
        source_path: price
        multiplier: 1000000
      - index: 1
        name: volume
        description: Session volume.
        source_path: volume
        multiplier: 1
  request:
    - endpoint: stock
      method: GET
      query_params:
        symbol: { source: strings.0 }
